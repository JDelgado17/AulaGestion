services:
  mysql:
    image: mysql:8.4
    container_name: aula_gestion_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aula_gestion
      MYSQL_USER: aula_user
      MYSQL_PASSWORD: aula_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - aula_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 15

  phpmyadmin:
    image: phpmyadmin:5
    container_name: aula_gestion_phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_USER: aula_user
      PMA_PASSWORD: aula_password
    ports:
      - "8081:80"

volumes:
  aula_mysql_data:

